name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx electron-builder --linux --publish never
      - uses: actions/upload-artifact@v4
        if: ${{ github.server_url == 'https://github.com' }}
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.deb
      - name: Publish Forgejo release assets
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.server_url != 'https://github.com' }}
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/publish-forgejo.sh dist/*.AppImage dist/*.deb

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bundle Windows Python
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip' -OutFile build/python-embed.zip
          Expand-Archive -Path build/python-embed.zip -DestinationPath build/windows-python -Force
          python -m pip download --only-binary=:all: --python-version 312 --platform win_amd64 'cryptography==44.0.3' --dest build/wheels
          Get-ChildItem build/wheels/*.whl | ForEach-Object { Expand-Archive -Path $_.FullName -DestinationPath build/windows-python -Force }
          Add-Content -Path build/windows-python/python312._pth -Value '..'
          Copy-Item -Recurse poc build/poc
          & build/windows-python/python.exe -c "import cffi; from cryptography.hazmat.primitives import cmac; print(cryptography.__version__)"
          & build/windows-python/python.exe -c "import poc.dt_discovery; print('discovery import ok')"
      - run: npm ci
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        if: ${{ github.server_url == 'https://github.com' }}
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.blockmap
      - name: Publish Forgejo release assets
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.server_url != 'https://github.com' }}
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/publish-forgejo.sh dist/*.exe dist/*.blockmap

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        if: ${{ github.server_url == 'https://github.com' }}
        with:
          name: macos
          path: dist/*.dmg
      - name: Publish Forgejo release assets
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.server_url != 'https://github.com' }}
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/publish-forgejo.sh dist/*.dmg

  smoke-windows:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: windows-latest
    needs: build-windows
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: installer
      - name: Install and test packaged app
        shell: pwsh
        run: |
          $installer = (Get-ChildItem installer/*.exe).FullName
          Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$env:TEMP\smoke-install") -Wait
          $python = "$env:TEMP\smoke-install\resources\python\python.exe"
          $deadline = [DateTime]::UtcNow.AddSeconds(30)
          while (-not (Test-Path -LiteralPath $python -PathType Leaf)) {
              if ([DateTime]::UtcNow -gt $deadline) { throw "Bundled Python not found at $python" }
              Start-Sleep -Milliseconds 250
          }
          $env:PYTHONPATH = "$env:TEMP\smoke-install\resources"
          & $python -c "import cffi; from cryptography.hazmat.primitives import cmac; print('CFFI and CMAC OK')"
          & $python -c "import poc.dt_discovery, poc.dt_pair, poc.dt_backend; print('Backend imports OK')"
          $helper = "$env:TEMP\smoke-install\Garlic-Firewall-Helper.bat"
          if (-not (Test-Path -LiteralPath $helper -PathType Leaf)) { throw 'Firewall helper missing beside GarlicTransfer.exe' }
          & $helper /help
          if ($LASTEXITCODE -ne 0) { throw "Firewall helper /help failed with exit code $LASTEXITCODE" }

  release:
    if: ${{ github.server_url == 'https://github.com' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [build-linux, build-windows, smoke-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts
      - run: ls -lh artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
